{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ThePantsProject{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="{% static '/images/logo.png' %}" alt="Logo">
        </div>

        <div class="dropdown">
            <button class="dropdown-button">Options</button>
            <div class="dropdown-content">
                <a href="{% url 'dropdown' %}?option=mens_pants">Men's Pants</a>
                <a href="{% url 'dropdown' %}?option=other">Other</a>
                <a href="{% url 'gan_visualizer' %}">GAN Visualizer</a>
                <a href="{% url 'index' %}">VGG Visualizer</a>
            </div>
        </div>

        <div class="user-info">
            <div class="logged-in-as">
                <p>You are logged in as: <strong>{{ user.username }}</strong></p>
            </div>
            <form action="{% url 'logout' %}" method="post" class="logout">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        </div>
    </div>

    {% block content %}
    <!-- Content will be inserted here by templates that extend this base template -->
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
